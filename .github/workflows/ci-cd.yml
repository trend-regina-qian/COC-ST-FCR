name: CI/CD Pipeline

on:
  push:
    branches:
      - fcr-dev
  pull_request:
    branches:
      - fcr-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitoring-platform/requirements.txt

      # - name: Run tests
      #   run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh "$SERVER_USER@$SERVER_HOST" << 'EOF'
          set -e
          cd /opt/monitoring-platform || { mkdir -p /opt/monitoring-platform && cd /opt/monitoring-platform; }
          git pull origin fcr-dev || git clone -b fcr-dev https://github.com/trend-regina-qian/COC-ST-FCR.git .
          docker-compose down || true
          docker-compose up -d --build
          EOF
